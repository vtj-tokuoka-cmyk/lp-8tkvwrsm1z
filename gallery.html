<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォトギャラリー ｜ 澤村 友里</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar"></div>
<header id="site-header" data-cur="gallery.html"></header>

<div class="page-hero">
  <div class="in">
    <div class="eyebrow">GALLERY</div>
    <h1 id="ph-title"></h1>
    <p id="ph-lead"></p>
  </div>
</div>

<!-- 目次 -->
<section style="padding-top:clamp(30px,4vw,50px);padding-bottom:0">
  <div class="toc rv" id="toc"></div>
</section>

<!-- 写真 -->
<section id="photos" style="padding-top:clamp(40px,5vw,70px)">
  <div class="sec-head rv">
    <span class="sec-num">01</span>
    <h2 class="sec-title" id="t-photos"></h2>
    <span class="sec-sub">PHOTOS</span>
  </div>
  <div class="chips rv" id="chips"></div>
  <div class="masonry" id="grid"></div>
</section>

<!-- 写真集 -->
<section id="albums" style="background:linear-gradient(180deg,var(--bg-2),var(--bg))">
  <div class="sec-head rv">
    <span class="sec-num">02</span>
    <h2 class="sec-title" id="t-albums"></h2>
    <span class="sec-sub">PHOTO BOOKS</span>
  </div>
  <div id="alb-sample"></div>
  <div class="albums" id="alb-list"></div>
</section>

<footer id="site-footer"></footer>

<div id="lb"><span class="x">×</span><span class="nv prev">‹</span><img alt=""><span class="nv next">›</span><div class="cap"></div></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="parts.js"></script>
<script>
let CUR_CAT = 'all';

function renderPage(){
  document.getElementById('ph-title').textContent = T('secGallery');
  document.getElementById('ph-lead').textContent = {
    ja:'ポートレート、講演やイベントの記録、写真集。写真をクリックすると拡大表示されます。',
    en:'Portraits, records from talks and events, and photo books. Click any photo to enlarge.',
    vi:'Ảnh chân dung, tư liệu sự kiện và các bộ ảnh. Nhấp vào ảnh để phóng to.'
  }[LANG];

  document.getElementById('toc').innerHTML = [
    ['#photos',T('secGallery')],['#albums',T('secAlbums')]
  ].map((x,i)=>`<a href="${x[0]}">${String(i+1).padStart(2,'0')}　${x[1]}</a>`).join('');

  /* 写真 */
  document.getElementById('t-photos').textContent = T('secGallery');
  const cats = PHOTO_CATS.filter(c=>c.key==='all'||PHOTOS.some(p=>p.cat===c.key));
  document.getElementById('chips').innerHTML = cats.map(c=>
    `<button class="chip${CUR_CAT===c.key?' on':''}" data-k="${c.key}">${esc(L(c.label))}</button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{
    CUR_CAT=b.dataset.k;
    document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.k===CUR_CAT));
    drawGrid();
  });
  drawGrid();

  /* 写真集 */
  document.getElementById('t-albums').textContent = T('secAlbums');
  document.getElementById('alb-sample').innerHTML = sampleNote();
  document.getElementById('alb-list').innerHTML = ALBUMS.map(a=>{
    const go = a.url
      ? `<a class="go" href="${a.url}" target="_blank" rel="noopener">${T('viewAlbum')} ↗</a>`
      : `<span class="go dim">${T('preparing')}</span>`;
    return `<article class="card album rv">
      <div class="ph"><img src="${a.cover}" alt=""></div>
      <div class="bd">
        <h4>${esc(a.title)}</h4>
        <div class="m">${esc(a.date)}　／　${esc(L(a.count))}</div>
        <p>${esc(L(a.desc))}</p>
        ${go}
      </div></article>`;}).join('');
}

function drawGrid(){
  const list = PHOTOS.filter(p=>CUR_CAT==='all'||p.cat===CUR_CAT);
  document.getElementById('grid').innerHTML = list.length
    ? list.map((p,i)=>`<figure class="rv"><img src="${p.src}" alt="" loading="lazy">
        <figcaption>${esc(L(p.caption))}</figcaption></figure>`).join('')
    : `<p class="empty">${T('preparing')}</p>`;
  bindReveal();
  bindLightbox('#grid figure');
}

function bindLightbox(sel){
  const figs=[...document.querySelectorAll(sel)],lb=document.getElementById('lb');
  if(!lb) return;
  const im=lb.querySelector('img'),cap=lb.querySelector('.cap');let cur=0;
  function show(i){cur=(i+figs.length)%figs.length;
    im.src=figs[cur].querySelector('img').src;
    const fc=figs[cur].querySelector('figcaption');
    cap.textContent=fc?fc.textContent:'';lb.classList.add('on');}
  figs.forEach((f,i)=>f.onclick=()=>show(i));
  lb.onclick=e=>{
    if(e.target.classList.contains('prev')){show(cur-1);e.stopPropagation();}
    else if(e.target.classList.contains('next')){show(cur+1);e.stopPropagation();}
    else if(e.target!==im){lb.classList.remove('on');}};
  document.onkeydown=e=>{
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')lb.classList.remove('on');
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='ArrowRight')show(cur+1);};
}
</script>
</body>
</html>
