<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講演依頼・実績 ｜ 澤村 友里</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar"></div>
<header id="site-header" data-cur="lecture.html"></header>

<div class="page-hero">
  <div class="in">
    <div class="eyebrow">SPEAKING</div>
    <h1 id="ph-title"></h1>
    <p id="ph-lead"></p>
  </div>
</div>

<!-- 目次 -->
<section style="padding-top:clamp(30px,4vw,50px);padding-bottom:0">
  <div class="toc rv" id="toc"></div>
</section>

<!-- 01 講演テーマ -->
<section id="topics" style="padding-top:clamp(40px,5vw,70px)">
  <div class="sec-head rv">
    <span class="sec-num">01</span>
    <h2 class="sec-title" id="t-topics"></h2>
    <span class="sec-sub">TOPICS</span>
  </div>
  <p class="sec-lead rv" id="t-topics-lead"></p>
  <div class="topics" id="topics-list"></div>
</section>

<!-- 02 講演パッケージ -->
<section id="packages" style="background:linear-gradient(180deg,var(--bg-2),var(--bg))">
  <div class="sec-head rv">
    <span class="sec-num">02</span>
    <h2 class="sec-title" id="t-package"></h2>
    <span class="sec-sub">PACKAGES</span>
  </div>
  <p class="sec-lead rv" id="t-package-lead"></p>
  <div class="packs" id="packs"></div>
</section>

<!-- 03 ご依頼の流れ -->
<section id="steps" style="background:#fff">
  <div class="sec-head rv">
    <span class="sec-num">03</span>
    <h2 class="sec-title" id="t-steps"></h2>
    <span class="sec-sub">HOW TO BOOK</span>
  </div>
  <p class="sec-lead rv" id="t-steps-lead"></p>
  <div class="steps" id="steps-list"></div>
</section>

<!-- 04 講師情報 -->
<section id="speaker" style="background:linear-gradient(180deg,var(--bg-2),var(--bg))">
  <div class="sec-head rv">
    <span class="sec-num">04</span>
    <h2 class="sec-title" id="t-speaker"></h2>
    <span class="sec-sub">SPEAKER INFO</span>
  </div>
  <p class="sec-lead rv" id="t-speaker-lead"></p>
  <dl class="spec rv" id="speaker-spec"></dl>
</section>

<!-- 05 開催予定 -->
<section id="upcoming" style="background:#fff">
  <div class="sec-head rv">
    <span class="sec-num">05</span>
    <h2 class="sec-title" id="t-upcoming"></h2>
    <span class="sec-sub">UPCOMING</span>
  </div>
  <div id="lec-sample"></div>
  <div id="up-list"></div>
</section>

<!-- 06 これまでの登壇 -->
<section id="past" style="background:linear-gradient(180deg,var(--bg-2),var(--bg))">
  <div class="sec-head rv">
    <span class="sec-num">06</span>
    <h2 class="sec-title" id="t-past"></h2>
    <span class="sec-sub">ARCHIVE</span>
  </div>
  <div class="chips rv" id="chips"></div>
  <div id="past-list"></div>
</section>

<!-- CTA -->
<section id="cta" style="background:linear-gradient(135deg,var(--red) 0%,#E8354B 55%,var(--red-bright) 100%);color:#fff;text-align:center">
  <div class="rv" id="cta-in"></div>
</section>

<footer id="site-footer"></footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="parts.js"></script>
<script>
let CUR_KIND = 'all';

function renderPage(){
  document.getElementById('ph-title').textContent = T('secLecture');
  document.getElementById('ph-lead').textContent = L(PAGE_LEADS.lecture);

  document.getElementById('toc').innerHTML = [
    ['#topics',T('secTopics')],['#packages',T('secPackage')],['#steps',T('secSteps')],
    ['#speaker',T('secSpeaker')],['#upcoming',T('secUpcoming')],['#past',T('secPast')]
  ].map((x,i)=>`<a href="${x[0]}">${String(i+1).padStart(2,'0')}　${x[1]}</a>`).join('');

  /* 01 テーマ */
  document.getElementById('t-topics').textContent = T('secTopics');
  document.getElementById('t-topics-lead').textContent = T('secTopicsLead');
  document.getElementById('topics-list').innerHTML = TOPICS.map(topicCard).join('');

  /* 02 パッケージ */
  document.getElementById('t-package').textContent = T('secPackage');
  document.getElementById('t-package-lead').textContent = T('secPackageLead');
  document.getElementById('packs').innerHTML = PACKAGES.map(packCard).join('');

  /* 03 流れ */
  document.getElementById('t-steps').textContent = T('secSteps');
  document.getElementById('t-steps-lead').textContent = T('secStepsLead');
  document.getElementById('steps-list').innerHTML = STEPS.map(stepCard).join('');

  /* 04 講師情報 */
  document.getElementById('t-speaker').textContent = T('secSpeaker');
  document.getElementById('t-speaker-lead').textContent = T('secSpeakerLead');
  document.getElementById('speaker-spec').innerHTML = SPEAKER_SPEC.map(specRow).join('');

  /* 05 開催予定 */
  document.getElementById('t-upcoming').textContent = T('secUpcoming');
  document.getElementById('lec-sample').innerHTML = sampleNote();
  const up = LECTURES.filter(l=>l.upcoming).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('up-list').innerHTML = up.length
    ? up.map(lecRow).join('') : `<p class="empty">${T('preparing')}</p>`;

  /* 06 これまでの登壇 */
  document.getElementById('t-past').textContent = T('secPast');
  const kinds = [...new Set(LECTURES.filter(l=>!l.upcoming).map(l=>l.kind))];
  document.getElementById('chips').innerHTML =
    [`<button class="chip${CUR_KIND==='all'?' on':''}" data-k="all">${LANG==='ja'?'すべて':(LANG==='en'?'All':'Tất cả')}</button>`]
    .concat(kinds.map(k=>`<button class="chip${CUR_KIND===k?' on':''}" data-k="${esc(k)}">${esc(L(KIND_LABELS[k]||k))}</button>`))
    .join('');
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{
    CUR_KIND=b.dataset.k;
    document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.k===CUR_KIND));
    drawPast(); bindReveal();
  });
  drawPast();

  /* CTA */
  document.getElementById('cta-in').innerHTML = `
    <h2 style="font-family:var(--serif);font-size:clamp(26px,4.4vw,50px);font-weight:500;line-height:1.4;margin-bottom:18px">
      ${{ja:'講演・MCのご依頼を<br>お待ちしています。',
         en:'I would love to speak<br>at your event.',
         vi:'Rất mong được<br>đồng hành cùng sự kiện của bạn.'}[LANG]}</h2>
    <p style="max-width:36em;margin:0 auto 34px;font-size:14.5px;opacity:.95">
      ${{ja:'テーマ・時間・ご予算はご相談に応じます。まずはお気軽にお問い合わせください。',
         en:'Topic, length and budget are all negotiable. Please get in touch.',
         vi:'Chủ đề, thời lượng và ngân sách đều có thể trao đổi. Xin vui lòng liên hệ.'}[LANG]}</p>
    <div style="display:flex;gap:13px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-w" href="index.html#contact">${T('navCta')} →</a>
      <a class="btn btn-gh" href="tel:${CONTACT_TEL}">☎ ${CONTACT_TEL_LABEL}</a>
    </div>`;
}

function drawPast(){
  const list = LECTURES.filter(l=>!l.upcoming)
    .filter(l=>CUR_KIND==='all'||l.kind===CUR_KIND)
    .sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('past-list').innerHTML = list.length
    ? list.map(lecRow).join('') : `<p class="empty">${T('preparing')}</p>`;
}
</script>
</body>
</html>
