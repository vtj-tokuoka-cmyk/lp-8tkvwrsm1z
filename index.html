<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澤村 友里 ｜ 講演・イベント出演のご依頼</title>
<meta name="description" content="ベトナムトレーディング株式会社 代表取締役社長 澤村友里。外国人材の雇用、日越の相互理解、学生起業、多文化共生。講演・MCのご依頼を承ります。">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar"></div>
<header id="site-header"></header>

<!-- ============ HERO ============ -->
<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-l" id="hero-l"></div>
  <div class="hero-r"><img src="img/p_8743.jpg" alt="澤村友里"></div>
  <div class="scrolldown"><i></i><span>SCROLL</span></div>
</div>

<!-- ============ STATS ============ -->
<div class="stats" id="stats"></div>

<!-- ============ 目次 ============ -->
<section id="toc-sec" style="padding-top:clamp(48px,6vw,80px);padding-bottom:0">
  <div class="sec-head rv"><span class="sec-num">—</span><h2 class="sec-title" id="t-toc"></h2></div>
  <div class="toc rv" id="toc"></div>
</section>

<!-- ============ 01 講演のご依頼について ============ -->
<section id="lecture-info">
  <div class="sec-head rv">
    <span class="sec-num">01</span>
    <h2 class="sec-title" id="t-lecinfo"></h2>
    <span class="sec-sub">SPEAKING</span>
  </div>
  <p class="sec-lead rv" id="t-lecinfo-lead"></p>
  <div class="teaser rv" id="teaser"></div>
  <div class="teaser-recent rv" id="teaser-recent"></div>
  <div class="more-wrap rv"><a class="btn btn-r" id="t-more-lecdetail" href="lecture.html"></a></div>
</section>

<!-- ============ 02 メディア出演 ============ -->
<section id="media" style="background:#fff">
  <div class="sec-head rv">
    <span class="sec-num">02</span>
    <h2 class="sec-title" id="t-media"></h2>
    <span class="sec-sub">MEDIA</span>
  </div>
  <div id="media-sample"></div>
  <div class="media-list rv" id="media-list"></div>
</section>

<!-- ============ 03 澤村友里について ============ -->
<section id="profile" style="background:linear-gradient(180deg,var(--bg-2),var(--bg))">
  <div class="sec-head rv">
    <span class="sec-num">03</span>
    <h2 class="sec-title" id="t-profile"></h2>
    <span class="sec-sub">PROFILE</span>
  </div>
  <div class="prof">
    <div class="prof-photo rv">
      <img src="img/q_158.jpg" alt="澤村友里">
      <span class="cap">YURI SAWAMURA</span>
    </div>
    <div class="prof-body rv" id="prof-body"></div>
  </div>

  <h3 class="sub-head rv" id="t-bio"></h3>
  <dl class="spec rv" id="bio-spec"></dl>

  <h3 class="sub-head rv" id="t-story"></h3>
  <div class="tl" id="timeline"></div>

</section>

<!-- ============ BAND ============ -->
<section class="band">
  <img src="img/p_49.jpg" alt="">
  <div class="band-in rv" id="band"></div>
</section>

<!-- ============ 04 こだわり ============ -->
<section id="kodawari">
  <div class="sec-head rv">
    <span class="sec-num">04</span>
    <h2 class="sec-title" id="t-kodawari"></h2>
    <span class="sec-sub">MY VALUES</span>
  </div>
  <div class="kod-top">
    <div id="kod-lead"></div>
    <div class="kod-img rv">
      <img src="img/q_9244.jpg" alt="澤村友里 アオザイ">
      <span class="tag2">ÁO DÀI</span>
    </div>
  </div>
  <div class="kod-cards" id="kod-cards"></div>
</section>

<!-- ============ 05 SNS・最新動画 ============ -->
<section id="video" style="background:linear-gradient(180deg,#fff,var(--bg-2))">
  <div class="sec-head rv">
    <span class="sec-num">05</span>
    <h2 class="sec-title" id="t-video"></h2>
    <span class="sec-sub">LATEST VIDEO</span>
  </div>
  <p class="sec-lead rv" id="t-video-lead"></p>
  <div class="video-main rv" id="player"></div>
  <h3 class="sub-head rv" id="t-pickup"></h3>
  <div class="vids" id="vids"></div>
  <div class="more-wrap rv"><a class="btn btn-o" id="t-more-sns" href="sns.html"></a></div>
</section>

<!-- ============ 06 グループ体制 ============ -->
<section id="group" style="background:var(--bg)">
  <div class="sec-head rv">
    <span class="sec-num">06</span>
    <h2 class="sec-title" id="t-group"></h2>
    <span class="sec-sub">GROUP</span>
  </div>
  <p class="sec-lead rv" id="t-group-lead"></p>
  <div class="grp" id="grp-list"></div>
  <h3 class="sub-head rv" id="t-services"></h3>
  <div class="svc" id="svc-list"></div>
</section>

<!-- ============ 07 ブログ ============ -->
<section id="blog" style="background:#fff">
  <div class="sec-head rv">
    <span class="sec-num">07</span>
    <h2 class="sec-title" id="t-blog"></h2>
    <span class="sec-sub">BLOG</span>
  </div>
  <div id="blog-sample"></div>
  <div class="posts" id="blog-list"></div>
  <div class="more-wrap rv"><a class="btn btn-o" id="t-more-blog" href="blog.html"></a></div>
</section>

<!-- ============ 08 ギャラリー ============ -->
<section id="gallery" style="background:linear-gradient(180deg,var(--bg-2),var(--bg))">
  <div class="sec-head rv">
    <span class="sec-num">08</span>
    <h2 class="sec-title" id="t-gallery"></h2>
    <span class="sec-sub">GALLERY</span>
  </div>
  <div class="gal" id="gal-list"></div>
  <div class="more-wrap rv"><a class="btn btn-o" id="t-more-gal" href="gallery.html"></a></div>
</section>

<!-- ============ 09 お問い合わせ ============ -->
<section id="contact">
  <div class="sec-head rv">
    <span class="sec-num">09</span>
    <h2 class="sec-title" id="t-contact"></h2>
    <span class="sec-sub">CONTACT</span>
  </div>
  <div class="form-wrap">
    <div class="form-side rv" id="form-side"></div>
    <form class="rv" id="cform" novalidate></form>
  </div>
</section>

<footer id="site-footer"></footer>

<div id="lb"><span class="x">×</span><span class="nv prev">‹</span><img alt=""><span class="nv next">›</span><div class="cap"></div></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="form.js"></script>
<script src="parts.js"></script>
<script>
function renderPage(){
  /* ---- HERO ---- */
  document.getElementById('hero-l').innerHTML = `
    <div class="eyebrow">${L(HERO.eyebrow)}</div>
    <h1><span class="sur">${T('nameSur')}</span><em>${T('nameGiven')}</em></h1>
    <div class="romaji">YURI SAWAMURA</div>
    <div class="role">
      ${HERO.roles.map((r,i)=> (i===0?`<b>${esc(L(r))}</b>`:esc(L(r)))).join('<br>')}
    </div>
    <p class="hero-lead">${L(HERO.lead)}</p>
    <div class="hero-cta">
      <a class="btn btn-r" href="#contact">${L(HERO.btnPrimary)} →</a>
      <a class="btn btn-o" href="lecture.html">${L(HERO.btnSecondary)}</a>
    </div>
    <div class="theme-chips">
      <span class="lbl">${T('secTopics')}</span>
      ${TOPICS.map(t=>`<a href="lecture.html#topics" title="${esc(L(t.title))}">${esc(L(t.short||t.title))}</a>`).join('')}
    </div>`;

  /* ---- STATS ---- */
  const done = LECTURES.filter(l=>!l.upcoming).length;
  document.getElementById('stats').innerHTML = STATS.map(st=>{
    const v = st.value==='auto:lectures' ? done : L(st.value);
    return `<div class="stat rv"><b>${esc(String(v))}<small>${esc(L(st.unit))}</small></b><p>${esc(L(st.label))}</p></div>`;
  }).join('');

  /* ---- 目次 ---- */
  document.getElementById('t-toc').textContent = T('secIndex');
  document.getElementById('toc').innerHTML = [
    ['#lecture-info',T('secLectureInfo')],['#media',T('secMedia')],['#profile',T('secProfile')],
    ['#kodawari',T('secKodawari')],['#video',T('secVideo')],['#group',T('secGroup')],
    ['#blog',T('secBlog')],['#gallery',T('secGallery')],['#contact',T('secContact')]
  ].map((x,i)=>`<a href="${x[0]}">${String(i+1).padStart(2,'0')}　${x[1]}</a>`).join('');

  /* ---- 01 講演のご依頼について（講演ページへの導線） ---- */
  document.getElementById('t-lecinfo').textContent = T('secLectureInfo');
  document.getElementById('t-lecinfo-lead').textContent = T('secLectureInfoLead');
  document.getElementById('t-more-lecdetail').textContent = T('moreLecDetail') + ' →';
  document.getElementById('teaser').innerHTML = `
    <div class="col">
      <h4>${T('teaserTopics')}</h4>
      <ul>${TOPICS.map(t=>`<li><b>${esc(L(t.title))}</b></li>`).join('')}</ul>
    </div>
    <div class="col">
      <h4>${T('teaserPacks')}</h4>
      <ul>${PACKAGES.map(p=>`<li><b>${esc(L(p.name))}</b><br><span>${T('perTime')} ${esc(L(p.time))}</span></li>`).join('')}</ul>
    </div>
    <div class="col">
      <h4>${T('teaserSteps')}</h4>
      <div class="steps-mini">${STEPS.map(x=>`<span>${x.no}　${esc(L(x.title))}</span>`).join('')}</div>
    </div>`;
  const recent = LECTURES.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  document.getElementById('teaser-recent').innerHTML = `<h4>${T('teaserRecent')}</h4>` +
    recent.map(l=>`<div class="row">
      <div class="d">${fmtDate(l.date)}</div>
      <div><div class="t">${esc(L(l.title))}</div>${L(l.host)?`<div class="h">${esc(L(l.host))}</div>`:''}</div>
      <span class="tag n">${esc(L(KIND_LABELS[l.kind]||l.kind))}</span>
    </div>`).join('');

  /* ---- 05 メディア ---- */
  document.getElementById('t-media').textContent = T('secMedia');
  document.getElementById('media-sample').innerHTML = sampleNote();
  document.getElementById('media-list').innerHTML = MEDIA.slice()
    .sort((a,b)=>b.date.localeCompare(a.date)).map(mediaRow).join('');

  /* ---- 06 プロフィール ---- */
  document.getElementById('t-profile').textContent   = T('secProfile');
  document.getElementById('t-bio').textContent       = T('secBio');
  document.getElementById('t-story').textContent     = T('secStory');
  document.getElementById('prof-body').innerHTML     = profileText();
  document.getElementById('bio-spec').innerHTML      = PROFILE_SPEC.map(specRow).join('');
  document.getElementById('timeline').innerHTML = TIMELINE.map(t=>`
    <div class="tl-item rv">
      <div class="tl-year">${t.year}</div>
      <h3>${esc(L(t.title))}</h3>
      <p>${esc(L(t.body))}</p>
    </div>`).join('');

  /* ---- BAND ---- */
  document.getElementById('band').innerHTML = `<h3>${L(BAND.title)}</h3><p>${esc(BAND.sub)}</p>`;

  /* ---- 07 こだわり ---- */
  document.getElementById('t-kodawari').textContent = T('secKodawari');
  document.getElementById('kod-lead').innerHTML = `
    <h3 class="kod-title rv">${L(KODAWARI_TITLE)}</h3>
    <p class="kod-lead rv">${esc(L(KODAWARI_LEAD))}</p>`;
  document.getElementById('kod-cards').innerHTML = KODAWARI.map(k=>`
    <article class="card kod-card rv">
      <div class="ico">${k.no}</div>
      <h4>${esc(L(k.title))}</h4>
      <p>${esc(L(k.body))}</p>
    </article>`).join('');

  /* ---- 08 動画 ---- */
  document.getElementById('t-video').textContent      = T('secVideo');
  document.getElementById('t-video-lead').textContent = T('secVideoLead');
  document.getElementById('t-pickup').textContent     = T('secPickup');
  document.getElementById('t-more-sns').textContent   = T('moreSns');
  renderPlayer();
  document.getElementById('vids').innerHTML = VIDEOS.slice(0,6).map(videoCard).join('');
  bindVideoClicks();

  /* ---- 09 グループ ---- */
  document.getElementById('t-group').textContent = T('secGroup');
  document.getElementById('t-group-lead').textContent = T('secGroupLead');
  document.getElementById('t-services').textContent = T('secServices');
  document.getElementById('grp-list').innerHTML = GROUP.map(groupCard).join('');
  document.getElementById('svc-list').innerHTML = SERVICES.map(serviceCard).join('');

  /* ---- 10 ブログ ---- */
  document.getElementById('t-blog').textContent = T('secBlog');
  document.getElementById('t-more-blog').textContent = T('moreBlog');
  document.getElementById('blog-sample').innerHTML = sampleNote();
  const posts = POSTS.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  document.getElementById('blog-list').innerHTML = posts.map(postCard).join('');

  /* ---- 11 ギャラリー ---- */
  document.getElementById('t-gallery').textContent = T('secGallery');
  document.getElementById('t-more-gal').textContent = T('moreGallery');
  document.getElementById('gal-list').innerHTML = PHOTOS.slice(0,3).map(p=>`
    <figure class="rv"><img src="${p.src}" alt="" style="object-position:${p.pos||'50% 30%'}">
      <figcaption>${esc(L(p.caption))}</figcaption></figure>`).join('');
  bindLightbox('#gal-list figure');

  /* ---- 12 フォーム ---- */
  document.getElementById('t-contact').textContent = T('secContact');
  renderForm();
}

/* プロフィール本文（data.js の PROFILE_TEXT を表示） */
function profileText(){
  const paras = L(PROFILE_TEXT).join('');
  return paras + `<div class="sign"><span>${esc(L(HERO.roles[0]))}</span><strong>${T('name')}</strong></div>`;
}

/* ライトボックス */
function bindLightbox(sel){
  const figs=[...document.querySelectorAll(sel)],lb=document.getElementById('lb');
  if(!lb) return;
  const im=lb.querySelector('img'),cap=lb.querySelector('.cap');let cur=0;
  function show(i){cur=(i+figs.length)%figs.length;
    im.src=figs[cur].querySelector('img').src;
    const fc=figs[cur].querySelector('figcaption');
    cap.textContent=fc?fc.textContent:'';lb.classList.add('on');}
  figs.forEach((f,i)=>f.onclick=()=>show(i));
  lb.onclick=e=>{
    if(e.target.classList.contains('prev')){show(cur-1);e.stopPropagation();}
    else if(e.target.classList.contains('next')){show(cur+1);e.stopPropagation();}
    else if(e.target!==im){lb.classList.remove('on');}};
  document.onkeydown=e=>{
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')lb.classList.remove('on');
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='ArrowRight')show(cur+1);};
}
</script>
</body>
</html>
