function renderPage(){

    <div class="stat rv"><b>3<small>${T('unitCorp')}</small></b><p>${T('statGroup')}</p></div>

  document.getElementById('toc').innerHTML = [
    ['#topics',T('secTopics')],['#packages',T('secPackage')],['#steps',T('secSteps')],
    ['#lecture',T('secLecture')],['#media',T('secMedia')],['#profile',T('secProfile')],
    ['#kodawari',T('secKodawari')],['#video',T('secVideo')],['#group',T('secGroup')],
    ['#blog',T('secBlog')],['#gallery',T('secGallery')],['#contact',T('secContact')]

  document.getElementById('t-topics-lead').textContent = T('secTopicsLead');
  document.getElementById('topics-list').innerHTML = TOPICS.map(topicCard).join('');

  /* ---- 02 パッケージ ---- */

  document.getElementById('t-package-lead').textContent = T('secPackageLead');
  document.getElementById('packs').innerHTML = PACKAGES.map(packCard).join('');

  /* ---- 03 ご依頼の流れ ---- */

  document.getElementById('t-steps-lead').textContent = T('secStepsLead');
  document.getElementById('t-steps-cta').textContent = T('navCta') + ' →';
  document.getElementById('steps-list').innerHTML = STEPS.map(stepCard).join('');

  /* ---- 04 講演実績（直近4件） ---- */

  document.getElementById('t-bio').textContent       = T('secBio');

/* プロフィール本文 */
function profileText(){
  const txt = {
    ja:[`<p class="lead">ホーチミンに生まれ、熊本で育ちました。<em>ふたつの故郷をつなぐ架け橋でありたい</em>。</p>`,
        `<p>私はホーチミン市で生まれた、ベトナム系日本人です。2003年に来日し、熊本県で中学・高校時代を過ごしたのち、熊本県立大学を卒業しました。</p>`,
        `<p>2011年、大学在学中に、学生でありながら創業。就職活動をせず、自分で会社をつくる道を選びました。2013年にベトナムトレーディング株式会社が誕生し、代表取締役社長に就任。その後、2016年に日越協同組合、2017年にはホーチミンの現地法人を設立しています。</p>`,
        `<p>現在はグループ3法人を経営し、ベトナム人に特化した人材紹介と人材教育を中心に事業を展開しています。掲げる方針は一貫して「日本一ベトナム人を理解している会社」であること。</p>`,
        `<p>講演では、この現場で見てきたことを、きれいごとではない言葉でお話しします。</p>`],
    en:[`<p class="lead">Born in Ho Chi Minh City, raised in Kumamoto. <em>I want to be the bridge between my two homes.</em></p>`,
        `<p>I am a Vietnamese-Japanese, born in Ho Chi Minh City. I came to Japan in 2003, spent my junior high and high school years in Kumamoto, and graduated from the Prefectural University of Kumamoto.</p>`,
        `<p>In 2011, while still an undergraduate, I founded my first company rather than going through recruitment season. Vietnam Trading Co., Ltd. was born in 2013, where I became President &amp; CEO. Nichietsu Cooperative followed in 2016, and our Ho Chi Minh entity in 2017.</p>`,
        `<p>Today I run three group entities, focused on recruitment and education built specifically for Vietnamese talent. The principle has never changed: to be the company in Japan that understands Vietnamese people best.</p>`,
        `<p>When I speak, I talk about what I have actually seen on the ground — not the polished version.</p>`],
    vi:[`<p class="lead">Sinh ra tại TP.HCM, lớn lên ở Kumamoto. <em>Tôi muốn là nhịp cầu nối hai quê hương.</em></p>`,
        `<p>Tôi là người Nhật gốc Việt, sinh ra tại TP. Hồ Chí Minh. Năm 2003 tôi sang Nhật, học cấp 2 và cấp 3 tại Kumamoto, sau đó tốt nghiệp Đại học tỉnh lập Kumamoto.</p>`,
        `<p>Năm 2011, khi còn là sinh viên, tôi đã khởi nghiệp thay vì đi xin việc. Năm 2013 Công ty cổ phần Việt Nam Trading ra đời và tôi giữ chức Tổng giám đốc. Tiếp đó là Nghiệp đoàn Nichietsu (2016) và pháp nhân tại TP.HCM (2017).</p>`,
        `<p>Hiện tôi điều hành 3 pháp nhân, tập trung vào giới thiệu và đào tạo nhân lực dành riêng cho người Việt. Phương châm không đổi: trở thành công ty thấu hiểu người Việt nhất tại Nhật Bản.</p>`,
        `<p>Khi diễn thuyết, tôi kể những gì thực sự đã thấy tại hiện trường.</p>`]
  }[LANG];
  return txt.join('') + `<div class="sign"><span>${T('roleLine1')}</span><strong>${T('name')}</strong></div>`;
}

/* ライトボックス */
function bindLightbox(sel){
  const figs=[...document.querySelectorAll(sel)],lb=document.getElementById('lb');
  if(!lb) return;
  const im=lb.querySelector('img'),cap=lb.querySelector('.cap');let cur=0;
  function show(i){cur=(i+figs.length)%figs.length;
    im.src=figs[cur].querySelector('img').src;
    const fc=figs[cur].querySelector('figcaption');
    cap.textContent=fc?fc.textContent:'';lb.classList.add('on');}
  figs.forEach((f,i)=>f.onclick=()=>show(i));
  lb.onclick=e=>{
    if(e.target.classList.contains('prev')){show(cur-1);e.stopPropagation();}
    else if(e.target.classList.contains('next')){show(cur+1);e.stopPropagation();}
    else if(e.target!==im){lb.classList.remove('on');}};
  document.onkeydown=e=>{
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')lb.classList.remove('on');
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='ArrowRight')show(cur+1);};
}
