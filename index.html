<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澤村 友里 ｜ 講演・イベント出演のご依頼</title>
<meta name="description" content="ベトナムトレーディング株式会社 代表取締役社長 澤村友里。外国人材の雇用、日越の相互理解、学生起業、多文化共生。講演・MCのご依頼を承ります。">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

</head>
<body>
<div id="bar"></div>
<header id="site-header" data-cur="index.html"></header>

<!-- ============ HERO ============ -->
<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-l" id="hero-l"></div>
  <div class="hero-r"><img src="img/p_8743.jpg" alt="澤村友里"></div>
  <div class="scrolldown"><i></i><span>SCROLL</span></div>
</div>

<!-- ============ STATS ============ -->
<div class="stats" id="stats"></div>

<!-- ============ PHOTO STRIP ============ -->
<div class="strip" id="strip"></div>

<!-- ============ 01 講演のご依頼 ============ -->
<section id="lecture-info">
  <div class="lecinfo">
    <div class="ph rv">
      <img src="img/q_234.jpg" alt="対話する澤村友里">
      <span class="tag2">SPEAKING</span>
    </div>
    <div class="rv">
      <div class="eyebrow">01 &nbsp;SPEAKING</div>
      <h2 class="sec-title" id="t-lecinfo"></h2>
      <p class="sec-lead" id="t-lecinfo-lead" style="margin:18px 0 0"></p>
      <ul class="themes" id="themes"></ul>
      <a class="btn btn-r" id="t-more-lecdetail" href="lecture.html"></a>
    </div>
  </div>
</section>

<!-- ============ 02 澤村友里について ============ -->
<section id="profile" style="background:#fff">
  <div class="sec-head rv">
    <span class="sec-num">02</span>
    <h2 class="sec-title" id="t-profile"></h2>
    <span class="sec-sub">PROFILE</span>
  </div>
  <div class="prof">
    <div class="prof-photo rv">
      <img src="img/q_158.jpg" alt="澤村友里">
      <span class="cap">YURI SAWAMURA</span>
    </div>
    <div class="prof-body rv" id="prof-body"></div>
  </div>
</section>

<!-- ============ BAND ============ -->
<section class="band">
  <img src="img/p_49.jpg" alt="">
  <div class="band-in rv" id="band"></div>
</section>

<!-- ============ 03 こだわり ============ -->
<section id="kodawari">
  <div class="sec-head rv">
    <span class="sec-num">03</span>
    <h2 class="sec-title" id="t-kodawari"></h2>
    <span class="sec-sub">MY VALUES</span>
  </div>
  <div class="kod-top">
    <div id="kod-lead"></div>
    <div class="kod-img rv">
      <img src="img/q_9244.jpg" alt="澤村友里 アオザイ">
      <span class="tag2">ÁO DÀI</span>
    </div>
  </div>
  <div class="kod-cards" id="kod-cards"></div>
</section>

<!-- ============ 04 最新の動画・メディア ============ -->
<section id="video" style="background:linear-gradient(180deg,#fff,var(--bg-2))">
  <div class="sec-head rv">
    <span class="sec-num">04</span>
    <h2 class="sec-title" id="t-video"></h2>
    <span class="sec-sub">VIDEO &amp; MEDIA</span>
  </div>
  <div class="video-main rv" id="player"></div>
  <div class="vids" id="vids" style="margin-top:22px"></div>
  <div class="media-mini rv">
    <h3 class="sub-head" id="t-media" style="margin-top:36px"></h3>
    <div class="media-list" id="media-list"></div>
  </div>
  <div class="more-wrap rv"><a class="btn btn-o" id="t-more-sns" href="sns.html"></a></div>
</section>

<!-- ============ 05 グループ体制 ============ -->
<section id="group" style="background:var(--bg)">
  <div class="sec-head rv">
    <span class="sec-num">05</span>
    <h2 class="sec-title" id="t-group"></h2>
    <span class="sec-sub">GROUP</span>
  </div>
  <div class="grp" id="grp-list"></div>
  <div class="svc-pills rv" id="svc-list"></div>
</section>

<!-- ============ 06 ブログ ============ -->
<section id="blog" style="background:#fff">
  <div class="sec-head rv">
    <span class="sec-num">06</span>
    <h2 class="sec-title" id="t-blog"></h2>
    <span class="sec-sub">BLOG</span>
  </div>
  <div class="posts" id="blog-list"></div>
  <div class="more-wrap rv"><a class="btn btn-o" id="t-more-blog" href="blog.html"></a></div>
</section>

<!-- ============ 07 ギャラリー ============ -->
<section id="gallery" style="background:linear-gradient(180deg,var(--bg-2),var(--bg))">
  <div class="sec-head rv">
    <span class="sec-num">07</span>
    <h2 class="sec-title" id="t-gallery"></h2>
    <span class="sec-sub">GALLERY</span>
  </div>
  <div class="gal" id="gal-list"></div>
  <div class="more-wrap rv"><a class="btn btn-o" id="t-more-gal" href="gallery.html"></a></div>
</section>

<!-- ============ 08 お問い合わせ ============ -->
<section id="contact">
  <div class="sec-head rv">
    <span class="sec-num">08</span>
    <h2 class="sec-title" id="t-contact"></h2>
    <span class="sec-sub">CONTACT</span>
  </div>
  <div class="form-wrap">
    <div class="form-side rv" id="form-side"></div>
    <form class="rv" id="cform" novalidate></form>
  </div>
</section>

<footer id="site-footer"></footer>

<div id="lb"><span class="x">×</span><span class="nv prev">‹</span><img alt=""><span class="nv next">›</span><div class="cap"></div></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="form.js"></script>
<script src="parts.js"></script>
<script>
function renderPage(){
  /* ---- HERO ---- */
  document.getElementById('hero-l').innerHTML = `
    <div class="eyebrow">${L(HERO.eyebrow)}</div>
    <h1><span class="sur">${T('nameSur')}</span><em>${T('nameGiven')}</em></h1>
    <div class="romaji">YURI SAWAMURA</div>
    <div class="role"><b>${esc(L(HERO.roles[0]))}</b></div>
    <p class="hero-lead">${L(HERO.lead)}</p>
    <div class="hero-cta">
      <a class="btn btn-r" href="#contact">${L(HERO.btnPrimary)} →</a>
      <a class="btn btn-o" href="lecture.html">${L(HERO.btnSecondary)}</a>
    </div>`;

  /* ---- STATS ---- */
  const done = LECTURES.filter(l=>!l.upcoming).length;
  document.getElementById('stats').innerHTML = STATS.map(st=>{
    const v = st.value==='auto:lectures' ? done : L(st.value);
    return `<div class="stat rv"><b>${esc(String(v))}<small>${esc(L(st.unit))}</small></b><p>${esc(L(st.label))}</p></div>`;
  }).join('');

  /* ---- PHOTO STRIP ---- */
  document.getElementById('strip').innerHTML = STRIP.map(p=>`
    <figure class="rv"><img src="${p.src}" alt="" style="object-position:${p.pos||'50% 30%'}">
      <figcaption><b>${esc(L(p.label))}</b><span>${esc(p.sub||'')}</span></figcaption></figure>`).join('');

  /* ---- 01 講演のご依頼 ---- */
  document.getElementById('t-lecinfo').textContent = T('secLectureInfo');
  document.getElementById('t-lecinfo-lead').textContent = T('secTopicsLead');
  document.getElementById('themes').innerHTML = TOPICS.map(t=>`
    <li><i>${t.no}</i><a href="lecture.html#topics">${esc(L(t.title))}</a></li>`).join('');
  document.getElementById('t-more-lecdetail').textContent = T('moreLecDetail') + ' →';

  /* ---- 02 プロフィール（要約） ---- */
  document.getElementById('t-profile').textContent = T('secProfile');
  const paras = L(PROFILE_TEXT);
  document.getElementById('prof-body').innerHTML =
    paras.slice(0,3).join('') +
    `<div class="prof-more"><a class="btn btn-o" href="profile.html">${T('moreProfile')} →</a></div>`;

  /* ---- BAND ---- */
  document.getElementById('band').innerHTML = `<h3>${L(BAND.title)}</h3><p>${esc(BAND.sub)}</p>`;

  /* ---- 03 こだわり ---- */
  document.getElementById('t-kodawari').textContent = T('secKodawari');
  document.getElementById('kod-lead').innerHTML = `
    <h3 class="kod-title rv">${L(KODAWARI_TITLE)}</h3>
    <p class="kod-lead rv">${esc(L(KODAWARI_LEAD))}</p>`;
  document.getElementById('kod-cards').innerHTML = KODAWARI.map(k=>`
    <article class="card kod-card rv">
      <div class="ico">${k.no}</div>
      <h4>${esc(L(k.title))}</h4>
      <p>${esc(L(k.body))}</p>
    </article>`).join('');

  /* ---- 04 動画・メディア ---- */
  document.getElementById('t-video').textContent = T('secVideo');
  document.getElementById('t-media').textContent = T('secMediaMini');
  document.getElementById('t-more-sns').textContent = T('moreSns');
  renderPlayer();
  document.getElementById('vids').innerHTML = VIDEOS.slice(0,3).map(videoCard).join('');
  bindVideoClicks();
  document.getElementById('media-list').innerHTML = MEDIA.slice()
    .sort((a,b)=>b.date.localeCompare(a.date)).map(mediaRow).join('');

  /* ---- 05 グループ ---- */
  document.getElementById('t-group').textContent = T('secGroup');
  document.getElementById('grp-list').innerHTML = GROUP.map(groupCard).join('');
  document.getElementById('svc-list').innerHTML = SERVICES.map(s=>
    `<a href="${s.url}" target="_blank" rel="noopener">${esc(L(s.name))} ↗</a>`).join('');

  /* ---- 06 ブログ ---- */
  document.getElementById('t-blog').textContent = T('secBlog');
  document.getElementById('t-more-blog').textContent = T('moreBlog');
  const posts = POSTS.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  document.getElementById('blog-list').innerHTML = posts.map(postCard).join('');

  /* ---- 07 ギャラリー ---- */
  document.getElementById('t-gallery').textContent = T('secGallery');
  document.getElementById('t-more-gal').textContent = T('moreGallery');
  const picks = ['img/q_9442.jpg','img/q_8884.jpg','img/q_9823.jpg'];
  const galItems = picks.map(src=>PHOTOS.find(p=>p.src===src)).filter(Boolean);
  document.getElementById('gal-list').innerHTML = galItems.map(p=>`
    <figure class="rv"><img src="${p.src}" alt="" style="object-position:${p.pos||'50% 30%'}">
      <figcaption>${esc(L(p.caption))}</figcaption></figure>`).join('');
  bindLightbox('#gal-list figure');

  /* ---- 08 フォーム ---- */
  document.getElementById('t-contact').textContent = T('secContact');
  renderForm();
}

/* ライトボックス */
function bindLightbox(sel){
  const figs=[...document.querySelectorAll(sel)],lb=document.getElementById('lb');
  if(!lb) return;
  const im=lb.querySelector('img'),cap=lb.querySelector('.cap');let cur=0;
  function show(i){cur=(i+figs.length)%figs.length;
    im.src=figs[cur].querySelector('img').src;
    const fc=figs[cur].querySelector('figcaption');
    cap.textContent=fc?fc.textContent:'';lb.classList.add('on');}
  figs.forEach((f,i)=>f.onclick=()=>show(i));
  lb.onclick=e=>{
    if(e.target.classList.contains('prev')){show(cur-1);e.stopPropagation();}
    else if(e.target.classList.contains('next')){show(cur+1);e.stopPropagation();}
    else if(e.target!==im){lb.classList.remove('on');}};
  document.onkeydown=e=>{
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')lb.classList.remove('on');
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='ArrowRight')show(cur+1);};
}
</script>
</body>
</html>
